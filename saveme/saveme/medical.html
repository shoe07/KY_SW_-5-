<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>SaveMe – 의료 정보</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">

    <header class="top-bar">
      <h1 class="logo">의료 정보</h1>
    </header>

    <main class="page form-page">
      <p class="subtitle">지병, 알레르기, 혈액형 등 구조자가 빠르게 확인해야 하는 정보를 저장합니다.</p>

      <div class="form-group">
        <label for="name">이름 또는 별칭</label>
        <input type="text" id="name" placeholder="예: 홍길동" />
      </div>

      <div class="form-group">
        <label>혈액형</label>
        <div class="blood-grid">
          <label class="radio-pill"><input type="radio" name="blood" value="미입력" checked /> 미입력</label>
          <label class="radio-pill"><input type="radio" name="blood" value="A+" /> A+</label>
          <label class="radio-pill"><input type="radio" name="blood" value="A-" /> A-</label>
          <label class="radio-pill"><input type="radio" name="blood" value="B+" /> B+</label>
          <label class="radio-pill"><input type="radio" name="blood" value="B-" /> B-</label>
          <label class="radio-pill"><input type="radio" name="blood" value="AB+" /> AB+</label>
          <label class="radio-pill"><input type="radio" name="blood" value="AB-" /> AB-</label>
          <label class="radio-pill"><input type="radio" name="blood" value="O+" /> O+</label>
          <label class="radio-pill"><input type="radio" name="blood" value="O-" /> O-</label>
        </div>
      </div>

      <div class="form-group">
        <label for="conditions">지병</label>
        <textarea id="conditions" rows="3" placeholder="예: 당뇨, 고혈압"></textarea>
      </div>

      <div class="form-group">
        <label for="allergies">알레르기</label>
        <textarea id="allergies" rows="2" placeholder="예: 페니실린, 땅콩"></textarea>
      </div>

      <div class="form-group">
        <label for="medications">복용 약</label>
        <textarea id="medications" rows="2" placeholder="예: 아스피린 100mg 1일 1회"></textarea>
      </div>

      <div class="form-group">
        <label for="notes">기타 특이사항</label>
        <textarea id="notes" rows="2" placeholder="예: 심박조율기 삽입"></textarea>
      </div>

      <p class="disclaimer">이 정보는 현재 기기에 저장됩니다. 정확한 의료 판단은 의료진에게 맡기고, 응급 상황에서는 즉시 119에 신고하세요.</p>

      <button class="primary-btn" onclick="saveMedical()">의료 정보 저장</button>
      <div class="toast" id="toast">저장되었습니다 ✓</div>
    </main>

    <nav class="bottom-nav">
      <a href="index.html" class="nav-item">SOS</a>
      <a href="medical.html" class="nav-item active">의료</a>
      <a href="guardians.html" class="nav-item">보호자</a>
      <a href="message.html" class="nav-item">메시지</a>
      <a href="aed.html" class="nav-item">AED</a>
    </nav>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/medical.js"></script>
  <script>
    loadMedical();
  </script>
</body>
</html>
