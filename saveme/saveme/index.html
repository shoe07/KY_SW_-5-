<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>SaveMe – 응급 SOS</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">

    <!-- Header -->
    <header class="top-bar">
      <h1 class="logo">SaveMe</h1>
      <button class="icon-btn" onclick="location.href='settings.html'" aria-label="설정">⚙️</button>
    </header>

    <!-- Hero -->
    <main class="page sos-page">
      <p class="subtitle">응급상황에서 현재 위치와 의료 정보를 빠르게 전달하세요.</p>

      <!-- Status cards -->
      <div class="status-grid">
        <div class="status-card" id="card-ready">
          <span class="status-label">응급 준비 상태</span>
          <span class="status-val" id="ready-status">확인 중</span>
        </div>
        <div class="status-card">
          <span class="status-label">의료 정보</span>
          <span class="status-val" id="med-status">—</span>
        </div>
        <div class="status-card">
          <span class="status-label">보호자</span>
          <span class="status-val" id="guardian-status">—</span>
        </div>
        <div class="status-card">
          <span class="status-label">위치 권한</span>
          <span class="status-val" id="loc-status">—</span>
        </div>
      </div>

      <!-- SOS Button -->
      <button class="sos-btn" id="sos-btn" onclick="triggerSOS()">
        <span class="sos-label">SOS</span>
        <span class="sos-sub">119 연결 · 보호자 메시지 · 위치 발송</span>
      </button>

      <!-- Current info summary -->
      <div class="info-summary">
        <p class="info-title">현재 등록 정보</p>
        <p id="summary-text">이름/별칭: 미입력<br>혈액형: 미입력<br>보호자: 0명 등록</p>
      </div>
    </main>

    <!-- Nav -->
    <nav class="bottom-nav">
      <a href="index.html" class="nav-item active">SOS</a>
      <a href="medical.html" class="nav-item">의료</a>
      <a href="guardians.html" class="nav-item">보호자</a>
      <a href="message.html" class="nav-item">메시지</a>
      <a href="aed.html" class="nav-item">AED</a>
    </nav>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/sos.js"></script>
  <script>
    initSOS();
  </script>
</body>
</html>
