<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>SaveMe – 보호자</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">

    <header class="top-bar">
      <h1 class="logo">보호자</h1>
    </header>

    <main class="page form-page">
      <p class="subtitle">SOS 실행 시 응급 메시지를 받을 보호자 연락처를 등록합니다.</p>

      <div class="card">
        <p class="card-title">새 보호자 등록</p>

        <div class="form-group">
          <label for="g-name">이름</label>
          <input type="text" id="g-name" placeholder="예: 어머니" />
        </div>
        <div class="form-group">
          <label for="g-phone">전화번호</label>
          <input type="tel" id="g-phone" placeholder="010-0000-0000" />
        </div>
        <div class="form-group">
          <label for="g-rel">관계</label>
          <input type="text" id="g-rel" placeholder="예: 가족, 친구" />
        </div>
        <button class="primary-btn" onclick="addGuardian()">보호자 추가</button>
      </div>

      <div class="section-header">
        <span>등록된 보호자</span>
        <span id="guardian-count" class="badge">0명</span>
      </div>

      <div id="guardian-list">
        <p class="empty-msg">등록된 보호자가 없습니다. 위급 상황 전에 최소 1명을 등록해 주세요.</p>
      </div>

      <button class="secondary-btn" onclick="location.href='message.html'">테스트 문자 작성</button>
    </main>

    <nav class="bottom-nav">
      <a href="index.html" class="nav-item">SOS</a>
      <a href="medical.html" class="nav-item">의료</a>
      <a href="guardians.html" class="nav-item active">보호자</a>
      <a href="message.html" class="nav-item">메시지</a>
      <a href="aed.html" class="nav-item">AED</a>
    </nav>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/guardians.js"></script>
  <script>
    loadGuardians();
  </script>
</body>
</html>
